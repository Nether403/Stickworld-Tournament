name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-forbidden-names.mjs
      - run: node --test scripts/asset-pipeline.test.mjs
      - run: node scripts/check-asset-ledger.mjs
      - run: node scripts/check-game-integration.mjs
      - run: pnpm build
      - run: node scripts/check-no-runtime-ai.mjs
      - run: node scripts/check-play-bundle.mjs
      - run: pnpm typecheck
      - run: pnpm test

  determinism:
    name: determinism
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm determinism:node
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ runner.os }}
      - run: pnpm --filter @stickworld/sim-core exec playwright install --with-deps
      - run: pnpm determinism:browser
      - run: pnpm --filter @stickworld/physics-kit score:browser
      # Bundle aliases sim-core to source; build is a backstop if a future
      # harness starts resolving workspace package exports again.
      - run: pnpm build
      - run: pnpm --filter @stickworld/game-test-chamber score:browser
      - run: pnpm --filter @stickworld/game-hookline-sprint score:browser
      - run: pnpm --filter @stickworld/game-pickaxe-ascent score:browser
      - run: pnpm --filter @stickworld/game-launch-lab score:browser
      - run: pnpm --filter @stickworld/game-ragdoll-archery-rush score:browser
      - run: pnpm --filter @stickworld/game-hammer-throw-havoc score:browser
      - run: pnpm --filter @stickworld/game-pogo-tower score:browser
      - run: pnpm --filter @stickworld/game-rooftop-relay score:browser
      - run: pnpm --filter @stickworld/game-balance-bike-blitz score:browser
      - run: pnpm --filter @stickworld/game-cargo-chaos score:browser
      - run: pnpm --filter @stickworld/game-demolition-dive score:browser
      - run: pnpm --filter @stickworld/web exec playwright install --with-deps firefox webkit
      - run: pnpm --filter @stickworld/web e2e

  negative:
    name: negative
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stickworld/sim-core exec vitest run tests/stress-01.test.ts

  schema:
    name: schema
    needs: verify
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require Neon secrets (skip forks)
        id: neon
        run: |
          echo "NEON_API_KEY is $( [ -n "$NEON_API_KEY" ] && echo set || echo empty )"
          echo "NEON_PROJECT_ID is $( [ -n "$NEON_PROJECT_ID" ] && echo set || echo empty )"
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "Skipping schema job on fork (no secrets)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "NEON_API_KEY and NEON_PROJECT_ID are required on this repository."
            echo "They must be repository Actions *secrets* (Settings → Secrets and variables → Actions → Secrets), named exactly those two identifiers, not Actions variables."
            echo "If they are already saved, re-run this job from the Actions UI as a collaborator so GitHub injects them."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.neon.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.neon.outputs.skip != 'true'
        run: pnpm build
      - if: steps.neon.outputs.skip != 'true'
        run: pnpm --filter @stickworld/db ci-schema
